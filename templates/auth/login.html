<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RedaIA - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="logo-box"><span>RedaIA</span></div>

    <h1>Bem-vindo!</h1>

    {% include "_flash.html" %}

    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-pill">Entrar</button>
    </form>

    <p class="link-small">Esqueceu a senha? Fale com seu professor.</p>

    <p class="signup-text">Não tem uma conta?</p>
    <a href="{{ url_for('auth.cadastro') }}" class="btn-pill">Criar conta</a>

    <footer>REDAIA • PROJETO FACEPE</footer>
  </div>
</body>
</html>
