<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RedaIA - Login </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #ffffff 0%, #eafcfa 35%, #bdeceb 65%, #7bd3d2 100%);
        }

        body::before {
            content: "";
            position: absolute;
            top: -220px;
            left: -220px;
            width: 480px;
            height: 480px;
            border-radius: 43% 57% 65% 35% / 45% 40% 60% 55%;
            background: linear-gradient(135deg, #3b6f6d, #6fc7d1);
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            bottom: -260px;
            right: -260px;
            width: 560px;
            height: 560px;
            border-radius: 60% 40% 35% 65% / 55% 45% 55% 45%;
            background: linear-gradient(135deg, #3b6fd6, #6fc7d1);
            z-index: 0;
        }

         .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      text-align: center;
    }

    .logo-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 32px;
      background: #ffffff;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(30, 60, 110, 0.18);
    }

    .logo-box span {
      font-weight: 700;
      font-size: 1.6rem;
      color: #33507a;
      letter-spacing: .5px;
    }

    h1 {
      font-weight: 600;
      font-size: 2.1rem;
      color: #33507a;
      margin-bottom: 48px;
    }

    .field {
      text-align: left;
      margin-bottom: 34px;
    }

    .field label {
      display: block;
      font-size: .95rem;
      color: #3a5c8a;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid rgba(58, 92, 138, 0.35);
      background: transparent;
      padding: 6px 2px;
      font-family: inherit;
      font-size: 1rem;
      color: #2b3f5c;
      outline: none;
    }

    .field input::placeholder { color: rgba(43, 63, 92, 0.35); }
    .field input:focus { border-bottom-color: #33507a; }

    .btn-pill {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 999px;
      background: #ffffff;
      color: #2b3f5c;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(30, 60, 110, 0.15);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .btn-pill:hover { transform: translateY(-2px); color: #2b3f5c; }

    .link-small {
      display: block;
      margin: 16px 0 28px;
      font-size: .85rem;
      color: #3a5c8a;
      text-decoration: none;
    }

    .signup-text {
      font-size: .85rem;
      color: #3a5c8a;
      margin-bottom: 4px;
    }

    .signup-text a {
      color: #33507a;
      font-weight: 600;
      text-decoration: none;
    }

    footer {
      margin-top: 28px;
      font-size: .75rem;
      letter-spacing: 2px;
      color: rgba(58, 92, 138, 0.5);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-box"><span>RedaIA</span></div>

    <h1>Bem vindo!</h1>

    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label>Usuário:</label>
        <input type="text" name="email" placeholder="">
      </div>
      <div class="field">
        <label>Senha:</label>
        <input type="password" name="senha" placeholder="">
      </div>

      <!-- Enquanto não tem lógica real, avança direto pro dashboard -->
      <a href="{{ url_for('redacoes.dashboard') }}" class="btn-pill">Log in</a>
    </form>

    <a href="#" class="link-small">esqueci minha senha</a>

    <a href="#" class="btn-pill">CRIAR</a>

    <p class="signup-text" style="margin-top: 18px;">
      Não tem uma conta? <a href="#">CADASTRE-SE</a>
    </p>

    <footer>www.com</footer>
  </div>
</body>
</html>
